name: Feature Request
description: Suggest an idea, new flag, or enhancement for DockShift
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature or capability you'd like to see.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use Case / Problem
      description: Why would this feature be useful for developers and DevOps engineers?
    validations:
      required: true
